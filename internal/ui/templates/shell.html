{{define "page_start"}}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="referrer" content="no-referrer">
        <title>{{ .Title }}</title>
        <link rel="icon" href="{{ .Favicon }}">
        <link rel="stylesheet" href="{{ .CSS }}">
        <script src="{{ .JS }}"></script>
    </head>
    <body class="min-h-screen bg-base-100">
        <!-- Click blocker: prevents interaction during async operations -->
        <dialog id="click-blocker" class="m-0 h-screen w-screen max-h-screen max-w-[100vw] cursor-wait border-none bg-transparent p-0 outline-none"></dialog>
        <!-- Shared alert dialog -->
        <dialog id="action-dialog" class="modal">
            <div class="modal-box">
                <h3 id="action-dialog-title" class="font-bold text-lg">Notice</h3>
                <p id="action-dialog-message" class="py-4 text-base-content/70"></p>
                <div class="modal-action">
                    <form id="action-dialog-cancel-form" method="dialog">
                        <button id="action-dialog-cancel" class="btn btn-ghost">Cancel</button>
                    </form>
                    <button id="action-dialog-confirm" class="btn btn-primary">Close</button>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
        <header class="navbar bg-base-200 px-4">
            <div class="flex-1">
                <a href="/" class="text-xl font-semibold">Dens</a>
                {{if ne .Instance "main"}}<span class="badge badge-ghost ml-2">{{ .Instance }}</span>{{end}}
            </div>
            <div class="flex-none gap-2">
                {{if .ShowNav}}<a href="/settings" class="btn btn-ghost btn-sm">Settings</a>{{end}}
                <button id="theme-toggle" class="btn btn-ghost btn-sm" aria-label="Toggle theme">◐</button>
            </div>
        </header>
{{end}}
{{define "page_end"}}
    </body>
</html>
{{end}}
