name: Docs

# Builds the Hugo docs site and tests it (scripts/test.sh -docs) on pushes to
# main and on PRs that change it, and deploys it from main to Cloudflare
# Workers Static Assets, when DOCS_ENABLED is true. workflow_dispatch also
# builds it, and deploys it when run on main.
# Set the worker name in docs/wrangler.jsonc and site URL in docs/hugo.yaml.
# Follow docs/DEPLOYMENT.md before enabling deployment.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '!docs/dev/**'
      - 'scripts/test.sh'
      - 'scripts/vendor.sh'
      - 'scripts/build/common.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '!docs/dev/**'
      - 'scripts/test.sh'
      - 'scripts/vendor.sh'
      - 'scripts/build/common.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys from main wait their turn, never canceled. Each PR's runs are a
  # group of their own, so a PR never cancels a deploy waiting to start,
  # and its newer commit replaces its older run.
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether docs deployment is enabled
        id: check
        env:
          DOCS_ENABLED: ${{ vars.DOCS_ENABLED }}
        run: |
          if [[ "${DOCS_ENABLED:-}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "DOCS_ENABLED=true; continuing."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation deployment is disabled. Set the DOCS_ENABLED repository variable to true to build and deploy the documentation."
          fi

  site:
    needs: ci-gate
    if: ${{ needs.ci-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The site's module and the app's share a Go version; the test of the
      # site's icon is the app's.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            docs/go.sum

      # Hugo's version and hash live in scripts/vendor.sh with every other
      # pin. The build fails on any warning, and the site's icon must be
      # the app's mark.
      - name: Build and test the site
        run: ./scripts/test.sh -docs

      - name: Deploy to Cloudflare
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # shellcheck source=../../scripts/vendor.sh
          source ../scripts/vendor.sh
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
