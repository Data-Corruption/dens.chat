name: Release

# On pushes to main, ci.sh --plan checks which tests are needed. After those
# tests pass, ci.sh --execute publishes the release or finishes an interrupted
# attempt, in the android environment, whose key signs the Android app's APK,
# and then ci.sh --flatpak publishes the promoted release's Flatpak, in the
# flatpak environment. PRs always run validation and never publish. Before the first
# release (no CHANGELOG.md heading and no version tag), pushes to main get the
# same validation as PRs and publish nothing.
#
# A version that already has a Git tag skips the broad test suites. Changed
# installers still get tested before publication. Retrying an older release
# after a newer one went live only finishes the older tag and cleanup.
#
# CI is opt-in. A tiny gate job reports when the CI_ENABLED repository
# variable is absent or false; every build, test, and publication job stays
# skipped until it is exactly "true".
#
# GitHub's built-in "Re-run jobs" operation uses the original GITHUB_SHA and
# GITHUB_REF, so interrupted publications resume at the same commit without a
# workflow_dispatch trigger or a new push.
#
# DO NOT RENAME OR MOVE THIS FILE. Sigstore derives the keyless certificate
# subject from the OIDC job_workflow_ref claim, which is this file's path:
#
#     https://github.com/OWNER/REPO/.github/workflows/release.yml@refs/heads/main
#
# That exact string is baked into install.sh, install.ps1, every released
# binary, and the docs. Renaming or moving this file breaks signature
# verification for every installation already in the field, and publishing a new
# release cannot repair it, because existing installers verify against the old
# identity before they will accept anything new. The contents are free to
# change; only the path is frozen.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  # Keep main releases serialized while allowing unrelated PRs to validate in
  # parallel. A newer commit may replace an older run of the same PR.
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether CI is enabled
        id: check
        env:
          CI_ENABLED: ${{ vars.CI_ENABLED }}
        run: |
          if [[ "${CI_ENABLED:-}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "CI_ENABLED=true; continuing."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI is disabled. Set the CI_ENABLED repository variable to true to run validation and releases."
          fi

  release-plan:
    needs: ci-gate
    if: ${{ needs.ci-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      e2e_required: ${{ steps.plan.outputs.e2e_required }}
      installer_tests_required: ${{ steps.plan.outputs.installer_tests_required }}
      release_required: ${{ steps.plan.outputs.release_required }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pinned rclone
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          rclone_bin=$(./scripts/vendor.sh rclone | sed -n 's/^rclone=//p')
          [[ -n "$rclone_bin" && -x "$rclone_bin" ]] || {
            echo "vendor.sh returned no executable rclone path" >&2
            exit 1
          }
          dirname "$rclone_bin" >> "$GITHUB_PATH"

      - name: Plan validation without publishing
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERBOSE: ${{ vars.VERBOSE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # PRs need neither release credentials nor a changelog heading.
            echo "e2e_required=true" >> "$GITHUB_OUTPUT"
            echo "installer_tests_required=false" >> "$GITHUB_OUTPUT"
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          else
            ./scripts/ci.sh --plan
          fi

  # Native Windows coverage: runs the Go test suite with the windows build
  # tags (pure Go, no C toolchain needed), parses the PowerShell scripts with
  # Windows PowerShell 5.1, which is what users run install.ps1 with, and
  # runs the lifecycle e2e with the exact installer candidate. The runner is
  # a throwaway machine, so the e2e installs the real service.
  windows-e2e:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.e2e_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Generated frontend outputs are intentionally gitignored. The release
      # job builds the real assets; this job only needs embed inputs to compile
      # and run the Go test suite natively.
      - name: Create compile-only frontend placeholders
        shell: pwsh
        run: |
          Set-Content internal/ui/assets/css/output.css ""
          Set-Content internal/ui/assets/js/output.js ""
          Set-Content internal/ui/assets/manifest.json '{"css/output.css":"test","js/output.js":"test","js/voice.worklet.js":"test","wasm/rnnoise.wasm":"test"}'

      - name: Test native Windows build
        shell: pwsh
        run: go test ./...


      - name: Parse install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($path in @("scripts/install.ps1", "scripts/test-lifecycle-e2e.ps1", "scripts/test-den-e2e.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${path}: $_" }
              exit 1
            }
          }

      - name: Render exact Windows release candidate
        shell: bash
        run: |
          source scripts/ci.sh
          configure_release_identity
          RELEASE_DIR=out/windows-installer-candidate
          package_installers

      - name: Build Windows fixture releases
        shell: bash
        run: scripts/test/fixture-releases.sh out/windows-e2e windows-amd64

      - name: Test exact Windows installer candidate
        shell: powershell
        run: scripts/test-lifecycle-e2e.ps1 -ReleaseDir out/windows-e2e -InstallerCandidate out/windows-installer-candidate/install.ps1

      - name: Fetch pinned Caddy for Windows
        shell: bash
        run: |
          zip=$(./scripts/vendor.sh caddy-windows | sed -n 's/^caddy-windows=//p')
          echo "CADDY_ZIP=$(cygpath -w "$zip")" >> "$GITHUB_ENV"

      - name: Test a den on Windows behind Caddy
        shell: powershell
        run: scripts/test-den-e2e.ps1 -ReleaseDir out/windows-e2e -CaddyZip $env:CADDY_ZIP


  # The Linux checks that need no containers: the Go suite, which the
  # release job's build relies on rather than running it again, the
  # third-party notices, shell lint, the page's tests and the release state
  # machine.
  linux-tests:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.e2e_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install pinned rclone
        run: |
          set -euo pipefail
          rclone_bin=$(./scripts/vendor.sh rclone | sed -n 's/^rclone=//p')
          [[ -n "$rclone_bin" && -x "$rclone_bin" ]] || {
            echo "vendor.sh returned no executable rclone path" >&2
            exit 1
          }
          dirname "$rclone_bin" >> "$GITHUB_PATH"
          "$rclone_bin" version

      - name: Test Go packages
        run: ./scripts/test.sh

      - name: Check the third-party notices are current
        run: ./scripts/notices.sh --check

      - name: Lint shell scripts
        run: ./scripts/test.sh -lint

      - name: Test the page's scripts
        run: ./scripts/test.sh -js

      - name: Test release publication state machine
        run: ./scripts/test.sh -release

  # Runs the Linux lifecycle e2e in Incus system containers on every
  # supported distro, from unsigned fixture releases over file:// URLs.
  linux-e2e:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.e2e_required == 'true' }}
    # Ubuntu 24.04 provides Incus 6.0 LTS. System containers share the runner
    # kernel, so this does not require nested virtualization or /dev/kvm.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Incus
        uses: ./.github/actions/setup-incus

      - name: Run lifecycle E2E
        run: ./scripts/test.sh -e2e

      - name: Upload lifecycle E2E logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-e2e-logs
          path: out/lifecycle-e2e-logs
          if-no-files-found: ignore
          retention-days: 14

  # A member joins a den through Caddy, chats, calls, and is banned, in two
  # Incus containers.
  linux-den-e2e:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.e2e_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Incus
        uses: ./.github/actions/setup-incus

      - name: Run den E2E
        run: ./scripts/test.sh -den-e2e

      - name: Upload den E2E logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-e2e-logs
          path: out/den-e2e-logs
          if-no-files-found: ignore
          retention-days: 14

  # The Flatpak e2e in Incus containers: the release pipeline's publisher of
  # the Flatpak, then this tree's Flatpak, published by it and run for a
  # member. Releases publish the Flatpak, so they wait for it too.
  flatpak-e2e:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.e2e_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Incus
        uses: ./.github/actions/setup-incus

      # Ubuntu 24.04 lets a program make user namespaces only where an
      # AppArmor profile names it, and none does in a container, where the
      # Flatpak's sandbox makes them as the member.
      - name: Let containers make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run Flatpak E2E
        run: ./scripts/test.sh -flatpak-e2e

      - name: Show AppArmor's denials
        if: ${{ failure() }}
        run: sudo dmesg | grep 'apparmor="DENIED"' | tail -n 40 || true

      - name: Upload Flatpak E2E logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-e2e-logs
          path: out/flatpak-e2e-logs
          if-no-files-found: ignore
          retention-days: 14

  # The media module: regenerates it from its pinned inputs and fails if the
  # committed translation differs, and has exiftool look for anything
  # personal left in stripped copies.
  media-module:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.e2e_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check the module matches its inputs
        run: ./scripts/ffmpeg.sh --check

      - name: Check RNNoise's module matches its inputs
        run: ./scripts/rnnoise.sh --check

      - name: Check stripped copies with exiftool
        run: |
          set -euo pipefail
          exiftool=$(./scripts/vendor.sh exiftool | sed -n 's/^exiftool=//p')
          DENS_EXIFTOOL="$exiftool" go test ./internal/media/ffmpeg -run '^TestExiftoolFindsNothingLeft$' -count=1 -v

  # Fuzzes the media driver in the module and natively under
  # AddressSanitizer, beside the other jobs, for long enough that it ends
  # about when they do. Inputs that fail are kept as an artifact; go test
  # reruns them once they're in testdata/fuzz.
  media-fuzz:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.e2e_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # A count of runs, about six minutes' worth, rather than a time,
      # which Go 1.26's fuzzer can fail on as it stops (see the script).
      - name: Fuzz the driver
        run: ./scripts/ffmpeg.sh --fuzz 12000x

      - name: Upload failing inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-fuzz-failures
          path: internal/media/ffmpeg/testdata/fuzz
          if-no-files-found: ignore
          retention-days: 14

  release:
    # Pull requests never publish, and a push publishes only when the plan
    # asks for a release job, which it never does before the first release.
    # A status function permits intentionally skipped dependencies. Required
    # tests must all succeed; missing plan outputs, failures, and cancellation
    # must never open the publication gate.
    if: >-
      ${{ !cancelled() &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.ci-gate.outputs.enabled == 'true' &&
          needs.release-plan.result == 'success' &&
          needs.release-plan.outputs.release_required == 'true' &&
          ((needs.release-plan.outputs.e2e_required == 'true' &&
            !contains(needs.*.result, 'skipped') &&
            needs.windows-e2e.result == 'success' &&
            needs.linux-tests.result == 'success' &&
            needs.linux-e2e.result == 'success' &&
            needs.linux-den-e2e.result == 'success' &&
            needs.flatpak-e2e.result == 'success' &&
            needs.media-module.result == 'success' &&
            needs.media-fuzz.result == 'success') ||
           (needs.release-plan.outputs.e2e_required == 'false' &&
            needs.windows-e2e.result == 'skipped' &&
            needs.linux-tests.result == 'skipped' &&
            needs.linux-e2e.result == 'skipped' &&
            needs.linux-den-e2e.result == 'skipped' &&
            needs.flatpak-e2e.result == 'skipped' &&
            needs.media-module.result == 'skipped' &&
            needs.media-fuzz.result == 'skipped')) &&
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled') }}
    needs:
      - ci-gate
      - release-plan
      - windows-e2e
      - linux-tests
      - linux-e2e
      - linux-den-e2e
      - flatpak-e2e
      - media-module
      - media-fuzz
    # Installer validation runs here too; jobs do not share the E2E daemon.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The Android app's release key is a secret of the android environment,
    # which only main deploys to, so no other branch's workflow can read it
    # (release.md's The APK's key). Naming it changes the claims about the
    # job that the signing certificate carries, but not the identity
    # releases are checked against, which is this file's path and ref.
    environment: android
    permissions:
      contents: write # ci.sh pushes the release tag
      id-token: write # cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history + tags: ci.sh checks/pushes release tags

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # cosign is not installed here: ci.sh vendors the pinned release
      # itself, so CI signs with exactly the binary install.sh bootstraps.
      - name: Install pinned rclone
        run: |
          set -euo pipefail
          rclone_bin=$(./scripts/vendor.sh rclone | sed -n 's/^rclone=//p')
          [[ -n "$rclone_bin" && -x "$rclone_bin" ]] || {
            echo "vendor.sh returned no executable rclone path" >&2
            exit 1
          }
          dirname "$rclone_bin" >> "$GITHUB_PATH"
          "$rclone_bin" version

      - name: Set up Incus
        if: ${{ needs.release-plan.outputs.installer_tests_required == 'true' }}
        uses: ./.github/actions/setup-incus

      - name: Build, sign, and release
        env:
          VERBOSE: ${{ vars.VERBOSE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./scripts/ci.sh --execute

  # Publishes the promoted release's Flatpak to its repository on the
  # release host, or finishes an interrupted publication, once the release
  # has: see scripts/ci/flatpak.sh. Its signing key is a secret of the
  # flatpak environment, which only main deploys to, so no other branch's
  # workflow can read it; the R2 credentials are the repository's. Its
  # failure leaves the release alone: Re-run failed jobs finishes it, as
  # does the next push to main.
  flatpak:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: flatpak
    # Debian 13, whose flatpak, ostree and AppStream's tools the Flatpak e2e
    # and the VMs' builds use too.
    container: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git and the download tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git unzip >/dev/null

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Flatpak's tools
        run: bash scripts/flatpak.sh deps

      - name: Install pinned rclone
        run: |
          set -euo pipefail
          rclone_bin=$(./scripts/vendor.sh rclone | sed -n 's/^rclone=//p')
          [[ -n "$rclone_bin" && -x "$rclone_bin" ]] || {
            echo "vendor.sh returned no executable rclone path" >&2
            exit 1
          }
          dirname "$rclone_bin" >> "$GITHUB_PATH"
          "$rclone_bin" version

      - name: Publish the Flatpak
        env:
          VERBOSE: ${{ vars.VERBOSE }}
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ./scripts/ci.sh --flatpak
