<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay probe: clicks</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; background: #111; color: #ddd; }
  button { font: inherit; padding: 10px 18px; }
</style>
<h3>Relay probe: a click every two seconds</h3>
<button id="start">Start clicking</button>
<p id="out">Silent.</p>
<script>
  // A 5 ms burst of 2 kHz every two seconds, set on the audio clock: what
  // the source's capture and a microphone both pick out of silence.
  const out = document.getElementById('out');
  function start() {
    document.getElementById('start').disabled = true;
    const ctx = new AudioContext();
    let next = ctx.currentTime + 0.5, count = 0;
    const plan = () => {
      while (next < ctx.currentTime + 1) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 2000;
        gain.gain.value = 0.8;
        osc.connect(gain).connect(ctx.destination);
        osc.start(next);
        osc.stop(next + 0.005);
        next += 2;
        out.textContent = `Clicks: ${++count}`;
      }
    };
    plan();
    setInterval(plan, 250);
    ctx.resume();
  }
  document.getElementById('start').onclick = start;
  if (new URLSearchParams(location.search).get('auto')) start();
</script>
