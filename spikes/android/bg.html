<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Screen-off trial</title>
<body style="background:#000;color:#888;font:16px sans-serif">Screen-off trial: leave the phone be.</body>
<script>
// A call inside one page, for bg.sh: a tone goes from one peer connection
// to another and plays in an <audio>, as Dens plays a member's voice,
// with the microphone open and read as Dens's meters read it. The page
// says what it sent, received and played each second, through the
// console, which the spike logs.
//
//   bg.html?trial=NAME&order=before|after&tone=SECONDS
//
// order puts the audio contexts before the microphone, as Dens does, or
// after it; the tone plays for its first SECONDS, then the call is quiet.
const q = new URLSearchParams(location.search);
const trial = q.get('trial') || 'trial';
const after = q.get('order') === 'after';
const log = (s) => console.warn(`bg ${trial} ${s}`);
let meters, voice, gain, pc1, pc2, audio, analyser, samples;
let last = {};

async function run() {
    if (!after) contexts();
    const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    if (after) contexts();
    analyser = meters.createAnalyser();
    meters.createMediaStreamSource(mic).connect(analyser);
    samples = new Float32Array(analyser.fftSize);
    const osc = voice.createOscillator();
    osc.frequency.value = 220;
    gain = voice.createGain();
    gain.gain.value = 0;
    const dest = voice.createMediaStreamDestination();
    osc.connect(gain).connect(dest);
    osc.start();
    await Promise.all([meters.resume(), voice.resume()]);
    pc1 = new RTCPeerConnection();
    pc2 = new RTCPeerConnection();
    pc1.onicecandidate = (e) => e.candidate && pc2.addIceCandidate(e.candidate);
    pc2.onicecandidate = (e) => e.candidate && pc1.addIceCandidate(e.candidate);
    pc2.ontrack = (e) => {
        audio = new Audio();
        audio.autoplay = true;
        audio.volume = 0.05;
        audio.srcObject = e.streams[0];
        audio.play().catch((err) => log(`play refused: ${err.name}`));
    };
    pc1.addTrack(dest.stream.getAudioTracks()[0], dest.stream);
    await pc1.setLocalDescription();
    await pc2.setRemoteDescription(pc1.localDescription);
    await pc2.setLocalDescription();
    await pc1.setRemoteDescription(pc2.localDescription);
    tone(true);
    setTimeout(() => tone(false), Number(q.get('tone') || 25) * 1000);
    log(`ready, contexts ${after ? 'after' : 'before'} the microphone`);
    setInterval(report, 1000);
}

function contexts() {
    meters = new AudioContext();
    voice = new AudioContext({ sampleRate: 48000 });
}

function tone(on) {
    gain.gain.value = on ? 0.5 : 0;
    log(`tone ${on ? 'on' : 'off'}`);
}

async function report() {
    const now = {};
    (await pc1.getStats()).forEach((s) => {
        if (s.type === 'outbound-rtp') now.sent = s.packetsSent;
    });
    (await pc2.getStats()).forEach((s) => {
        if (s.type === 'inbound-rtp') {
            now.recv = s.packetsReceived;
            now.level = s.audioLevel;
        }
        if (s.type === 'media-playout') {
            now.played = s.totalSamplesCount;
            now.made = s.synthesizedSamplesDuration;
        }
    });
    analyser.getFloatTimeDomainData(samples);
    let sum = 0;
    for (const v of samples) sum += v * v;
    const d = (k) => (now[k] ?? 0) - (last[k] ?? 0);
    log(`${document.visibilityState} meters ${meters.state} voice ${voice.state} sent +${d('sent')} received +${d('recv')} level ${(now.level ?? 0).toFixed(3)} played +${d('played')} made up +${d('made').toFixed(2)}s mic ${Math.sqrt(sum / samples.length).toFixed(4)} audio ${audio ? (audio.paused ? 'paused' : 'playing') : 'none'}`);
    last = now;
}

document.addEventListener('visibilitychange', () => log(`now ${document.visibilityState}`));
document.addEventListener('freeze', () => log('frozen'));
document.addEventListener('resume', () => log('resumed'));
run().catch((e) => log(`failed: ${e}`));
</script>
