<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebView features</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
  button { font-size: 1.1rem; padding: 12px 16px; margin: 8px 0; width: 100%; }
  #results { font: 12px/1.4 monospace; white-space: pre-wrap; word-break: break-all; }
  #probe { position: fixed; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); visibility: hidden; }
  #full { display: none; }
</style>
</head>
<body>
<h1>WebView features</h1>
<p id="status">Running the tests that need no tap…</p>
<button id="tap">Run the tests that need a tap</button>
<div id="results"></div>
<div id="probe"></div>
<div id="full">full screen</div>
<script src="features.js"></script>
</body>
</html>
